services:
   redis:
     image: redis
     ports:
      - "6379:6379"
   nginx:
     image: nginx
     ports:
      - "8000:80"
      
     volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
   server1:
     build: ./server
     env_file:
      - ./server/.env
     environment:
        - SERVER_NAME="Server one"
     ports:
      - "5001:7000"

   server2:
     build: ./server
     env_file:
      - ./server/.env
     environment:
      - SERVER_NAME="Server two"
     ports:
      - "5002:7000"
   server3:
     build: ./server
     env_file:
      - ./server/.env
     environment:
      - SERVER_NAME="Server three"
     ports:
      - "5003:7000"
        
# we will change the port of local host only as docker is isolated